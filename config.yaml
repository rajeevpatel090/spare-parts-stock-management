# config.yaml - Configurable assumptions for the Spare Parts Stock Management prototype
# All values calibrate the synthetic data and baseline simulation.

data:
  num_skus: 5000
  target_inventory_value_cr: 6.0
  imported_share: 0.6
  
  # Lead times in days
  lead_time:
    imported:
      min: 7
      max: 45
    local:
      min: 1
      max: 5

baseline:
  emergency_rate: 0.22         # 22% of orders are emergency
  emergency_premium_min: 0.35  # 35% premium on emergency
  emergency_premium_max: 0.50  # 50% premium on emergency
  shrinkage_rate: 0.03         # 3% of inventory value unaccounted for per year

simulation:
  seed: 42
  days: 365
  service_bookings_per_day:
    min: 20
    max: 25

models:
  - "A-Class"
  - "C-Class"
  - "E-Class"
  - "GLC"
  - "GLE"
  - "S-Class"
  - "EQ"

classification:
  abc_thresholds:
    a: 0.80
    b: 0.95
  xyz_cv_thresholds:
    x: 0.5
    y: 1.0
  service_levels:
    FAST:
      target: 0.97
      z_value: 1.88
    CRITICAL_SLOW_IMPORTED:
      target: 0.99
      z_value: 2.33
    LONG_TAIL:
      target: 0.90
      z_value: 1.28
